# Block pull requests that introduce dependencies with known high-severity
# vulnerabilities, or with a licence we cannot ship.
#
# Requires the Dependency graph to be enabled:
#   Settings -> Code security and analysis -> Dependency graph
# Without it the action fails with "Dependency review is not supported on this
# repository", which is a configuration problem, not a code problem.

name: Dependency review

on:
  pull_request:
    branches: ["main", "mc/**"]

permissions:
  contents: read

jobs:
  review:
    name: Review dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
          # Copyleft licences are a real problem for a mod jar: shipping a
          # GPL-licensed library inside your jar relicenses the whole thing.
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0
