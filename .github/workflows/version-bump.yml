# Bump the mod version, update the changelog, tag, and push.
#
# Run manually: Actions -> Version bump -> Run workflow -> pick patch/minor/major.
#
# Pushing the tag triggers release.yml, so this one workflow takes you from
# "main is ready" to "published" without touching a terminal.
#
# Which bump?
#   patch  bug fixes only
#   minor  new features, OR a new Minecraft version (the artifact means
#          something different now, even if your code did not change)
#   major  breaking change for dependants or for existing worlds
#
# Details: docs/04-versioning-and-releases.md

name: Version bump

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Which part of the version to increase'
        required: true
        type: choice
        options: [patch, minor, major]
        default: patch
      dry_run:
        description: 'Work out the new version and show the diff, but do not push'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  bump:
    name: Bump and tag
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write   # commit the bump and push the tag
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          fetch-depth: 0

      # Releasing from a feature branch produces a tag that does not describe
      # anything users can get, so refuse early.
      - name: Refuse to release from a non-release branch
        run: |
          BRANCH="${GITHUB_REF#refs/heads/}"
          case "$BRANCH" in
            main|mc/*) echo "Releasing from '$BRANCH'." ;;
            *)
              echo "::error::Refusing to release from '$BRANCH'. Use main or an mc/* maintenance branch."
              exit 1
              ;;
          esac

      - name: Work out the new version
        id: version
        run: |
          CURRENT="$(grep -E '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')"
          NEXT="$(python3 scripts/release-tools.py next-version '${{ inputs.bump }}')"
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"
          echo "### Version bump" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$CURRENT\` → \`$NEXT\` (${{ inputs.bump }})" >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if the tag already exists
        run: |
          if git rev-parse "v${{ steps.version.outputs.next }}" >/dev/null 2>&1; then
            echo "::error::Tag v${{ steps.version.outputs.next }} already exists."
            exit 1
          fi

      - name: Apply the bump
        run: |
          python3 scripts/release-tools.py set-version "${{ steps.version.outputs.next }}"
          python3 scripts/release-tools.py release-changelog "${{ steps.version.outputs.next }}"

      - name: Validate metadata after the bump
        run: python3 scripts/validate-metadata.py

      - name: Show the diff
        run: git --no-pager diff

      - name: Summarise commits since the last tag
        run: |
          LAST_TAG="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          {
            echo ""
            echo "#### Commits since ${LAST_TAG:-the beginning}"
            echo ""
            if [ -n "$LAST_TAG" ]; then
              git log --no-merges --pretty='- %s' "$LAST_TAG..HEAD"
            else
              git log --no-merges --pretty='- %s'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit, tag and push
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          git add gradle.properties CHANGELOG.md
          git commit -m "chore(release): ${{ steps.version.outputs.next }}"
          git tag -a "v${{ steps.version.outputs.next }}" \
                  -m "Release ${{ steps.version.outputs.next }}"

          git push origin "HEAD:${GITHUB_REF#refs/heads/}"
          git push origin "v${{ steps.version.outputs.next }}"

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Pushed \`v${{ steps.version.outputs.next }}\`. The Release workflow takes it from here." >> "$GITHUB_STEP_SUMMARY"

      - name: Dry run notice
        if: ${{ inputs.dry_run }}
        run: echo "Dry run — nothing was committed or pushed." >> "$GITHUB_STEP_SUMMARY"
