# =============================================================================
# gradle.properties — THE SINGLE SOURCE OF TRUTH FOR EVERY VERSION NUMBER
# =============================================================================
#
# This is the only file you edit when upgrading to a new Minecraft version.
# Nothing below is duplicated in build.gradle, fabric.mod.json, or
# neoforge.mods.toml — those files read from here at build time.
#
# Full upgrade walkthrough: docs/05-upgrading-minecraft-versions.md
# Where every number comes from: docs/03-build-and-run.md#where-versions-come-from
# =============================================================================


# === Gradle daemon tuning ====================================================
# Minecraft decompilation is memory-hungry. 4G is comfortable; drop to 2G on a
# small machine, raise to 6G if you see OutOfMemoryError during :neoforge:build.
org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true
org.gradle.caching=true

# Configuration cache is OFF because Fabric Loom is not yet fully compatible
# with it inside IntelliJ IDEA. See https://github.com/FabricMC/fabric-loom/issues/1349
# NeoForge/ModDevGradle alone would support it. Leave this false unless you
# have dropped the Fabric subproject entirely.
org.gradle.configuration-cache=false


# === Mod identity ============================================================
# mod_id      Lowercase, [a-z0-9_], 2-64 chars. Used as your registry namespace,
#             resource-pack namespace, and config filename. Changing it later is
#             a breaking change for anyone with existing worlds — pick carefully.
# mod_group_id Your top-level Java package. Reverse-domain convention.
#
# Renaming all of these at once: ./scripts/rename-mod.sh (see docs/00-START-HERE.md)
mod_id=examplemod
mod_name=Example Mod
mod_group_id=com.example.examplemod
mod_author=Your Name
mod_license=MIT
mod_description=A server-side Minecraft mod built from the multiloader template.

# Homepage / issue tracker shown in the in-game mod list.
mod_homepage=https://github.com/Ranzlappen/Minecraft-java-mods
mod_sources=https://github.com/Ranzlappen/Minecraft-java-mods
mod_issues=https://github.com/Ranzlappen/Minecraft-java-mods/issues


# === Mod version =============================================================
# Semantic versioning. Do NOT hand-edit this during a release — the release
# workflow bumps it for you (.github/workflows/version-bump.yml).
# Read docs/04-versioning-and-releases.md before touching it.
mod_version=0.1.0


# === Minecraft ===============================================================
# minecraft_version       The exact version string Mojang publishes.
#                         Since 2026 this is calendar-based: 26.1, 26.2, 26.3...
#                         Pre-2026 versions keep the old 1.21.x form.
# java_version            Must match what this Minecraft version ships with.
#                         26.1+ -> 25.  1.20.5 through 1.21.11 -> 21.  Older -> 17.
#
# The two version *ranges* declare which Minecraft versions the jar will load
# on. They say the same thing in two different grammars, because the loaders
# disagree about syntax and neither accepts the other's:
#
#   minecraft_version_range         Maven range, used by neoforge.mods.toml.
#                                   [26.2,26.3) = "26.2 and its patches, not 26.3".
#   fabric_minecraft_version_range  Fabric's own range grammar, used by
#                                   fabric.mod.json. ~26.2 means the same thing.
#                                   Maven bracket syntax is NOT valid here and
#                                   Fabric will refuse to load the mod.
#
# Keep both tight. Minecraft breaks internal APIs on every drop, so a jar built
# against 26.2 is not safe to load on 26.3 even though it may appear to start.
minecraft_version=26.2
minecraft_version_range=[26.2,26.3)
fabric_minecraft_version_range=~26.2
java_version=25


# === Fabric ==================================================================
# loom_version   The Gradle plugin that sets up the Fabric dev environment.
#                IMPORTANT: two different plugin IDs exist, and which one you
#                use depends on whether Minecraft is obfuscated:
#                  net.fabricmc.fabric-loom        -> 26.1 and newer (unobfuscated)
#                  net.fabricmc.fabric-loom-remap  -> 1.21.11 and older (obfuscated)
#                This template uses the unobfuscated one. See
#                docs/05-upgrading-minecraft-versions.md#the-2026-unobfuscation-cliff
# loader_version Fabric Loader — the runtime that actually loads your mod.
# fabric_api_version Fabric API — the shared modding API. Suffix must match
#                    minecraft_version exactly.
#
# Check all three at https://fabricmc.net/develop
loom_version=1.17.19
loader_version=0.19.3
fabric_api_version=0.156.0+26.2


# === NeoForge ================================================================
# neoforge_version  Since 2026, NeoForge versions mirror Minecraft's:
#                   <mc major>.<mc minor>.<patch>.<build>, e.g. 26.2.0.57.
#                   Look up releases at https://projects.neoforged.net/neoforged/neoforge
# neoform_version   Used by the `common` subproject only. NeoForm gives common
#                   code plain Minecraft classes with NO loader API attached,
#                   which is what keeps common genuinely loader-agnostic.
#                   https://projects.neoforged.net/neoforged/neoform
# moddev_version    The ModDevGradle plugin version (build tooling only).
#                   https://projects.neoforged.net/neoforged/moddevgradle
neoforge_version=26.2.0.57
neoform_version=26.2-2
moddev_version=2.0.143


# === Publishing ==============================================================
# Filled in by you once, then used by .github/workflows/release.yml.
# Leave blank to skip that platform — the release job skips empty targets.
#
# modrinth_id     The project ID (not the slug) from your Modrinth project page.
# curseforge_id   The numeric project ID from your CurseForge project page.
modrinth_id=
curseforge_id=

# Comma-separated Minecraft versions to tag releases with on Modrinth/CurseForge.
# Usually just minecraft_version, but list every version the jar actually
# supports if minecraft_version_range spans several.
publish_game_versions=26.2
