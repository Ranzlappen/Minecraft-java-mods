# =============================================================================
# Access Transformers
# =============================================================================
#
# Minecraft makes a lot of useful fields and methods private. An Access
# Transformer rewrites their access modifier at load time so your code can
# reach them. Both loaders read this same file (NeoForge natively; Fabric via
# the equivalent mechanism configured in fabric/build.gradle).
#
# SYNTAX
#   <access> <fully.qualified.ClassName> <memberName> [descriptor]
#
#   public          make it public
#   public-f        make it public and strip `final`
#   protected       make it protected
#
# EXAMPLES (commented out — uncomment and adapt when you actually need one)
#
#   # A private field:
#   # public net.minecraft.server.MinecraftServer tickCount
#
#   # A private method — the descriptor is required to disambiguate overloads:
#   # public net.minecraft.world.entity.Entity setRot(FF)V
#
#   # A final field you need to reassign:
#   # public-f net.minecraft.world.level.Level isClientSide
#
# WHEN NOT TO USE ONE
#   Access Transformers are global: they change the class for every mod in the
#   instance. That is usually harmless, but stripping `final` from a field
#   another mod relies on being final can cause very confusing bugs.
#
#   If you only need to read one private field, an @Accessor Mixin is narrower
#   and cannot affect anybody else. Prefer that. Reach for an AT when you need
#   broad access, or when a Mixin cannot express what you need.
#
#   `validateAccessTransformers = true` is set in both build scripts, so a typo
#   or a stale entry here fails the build instead of silently doing nothing.
#
# Full explanation: docs/06-mixins-and-access-transformers.md
# =============================================================================
